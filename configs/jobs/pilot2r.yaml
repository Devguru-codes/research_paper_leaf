# Re-pilot after gate failure: Hadwiger-complete tokens, matched controls, no-rotation-aug arm.
# fold 0 plain and esa(euler) are reused from the pilot3 kernel (identical code path).
pip: [lpips]
kernel_sources: [maskhead]
common:
  exp: pilot2r
  backbone: convnext_tiny
  protocol: grouped
  seed: 0
  epochs: 40
  batch_size: 32
  workers: 3
  evals: [rotation, corruptions, cueconflict, topodestroy, crossdomain]
jobs:
  - {fold: 0, variant: esa, token: hadwiger, tag: had}
  - {fold: 0, variant: slabstat, token: ap, tag: ap}
  - {fold: 0, variant: global, token: hadwiger, tag: had}
  - {fold: 1, variant: esa, token: hadwiger, tag: had}
  - {fold: 1, variant: slabstat, token: ap, tag: ap}
  - {fold: 1, variant: global, token: hadwiger, tag: had}
  - {fold: 1, variant: plain}
  - {fold: 1, variant: esa, token: euler, tag: eu}
  - {fold: 0, variant: plain, rot_aug: false, tag: norot}
  - {fold: 0, variant: esa, token: hadwiger, rot_aug: false, tag: had_norot}
  - {fold: 0, variant: slabstat, token: ap, rot_aug: false, tag: ap_norot}
  - {fold: 0, variant: global, token: hadwiger, rot_aug: false, tag: had_norot}
