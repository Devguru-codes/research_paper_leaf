# Short diagnostic of the pilot (3 epochs) with heartbeat memory logging
pip: [lpips]
common:
  exp: pilotdbg
  backbone: convnext_tiny
  protocol: grouped
  fold: 0
  seed: 0
  epochs: 3
  batch_size: 32
  workers: 2
  evals: [rotation, corruptions, cueconflict, topodestroy]
jobs:
  - {variant: esa}
  - {variant: plain}
